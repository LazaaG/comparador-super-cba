[project]
name = "comparador-super-cba"
version = "0.1.0"
description = "Comparador de carritos de supermercados (Córdoba, Argentina)"
readme = "README.md"
requires-python = ">=3.11"
# Dev env detectado: Python 3.13. CI usa 3.11 (acta como floor de compat).
license = { text = "MIT" }
authors = [{ name = "Lazaro Gonzalez" }]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlite-utils>=3.36",
    "python-slugify>=8.0",
    "rapidfuzz>=3.6",
    "pandas>=2.2",
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.4",
    "httpx[cli]>=0.27",
]

[project.scripts]
super-scrape = "scrapers.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "scrapers", "storage", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# B008 = false positive con FastAPI Depends/Query
# B904 = "raise from" no aporta en HTTPException re-raise
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
